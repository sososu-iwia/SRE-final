global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.gmail.com:587
  smtp_from: alerts@quiz-app.internal
  smtp_auth_username: alerts@quiz-app.internal
  smtp_auth_password_file: /etc/alertmanager/smtp_password

route:
  # All alerts go to the default receiver unless a child route matches
  receiver: default-email
  group_by: [alertname, namespace, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical SLO alerts → PagerDuty (page on-call)
    - matchers:
        - severity="critical"
        - slo=~".+"
      receiver: pagerduty-critical
      group_wait: 0s
      repeat_interval: 30m
      continue: true

    # All critical alerts → Slack #incidents
    - matchers:
        - severity="critical"
      receiver: slack-incidents
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts → Slack #alerts
    - matchers:
        - severity="warning"
      receiver: slack-alerts
      group_wait: 1m
      repeat_interval: 4h

inhibit_rules:
  # Suppress warnings when a critical alert is already firing for the same target
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, namespace]

receivers:
  - name: default-email
    email_configs:
      - to: sre-team@quiz-app.internal
        send_resolved: true

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/pagerduty_key
        description: "{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}"
        severity: critical
        send_resolved: true

  - name: slack-incidents
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_webhook_incidents
        channel: "#incidents"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: slack-alerts
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_webhook_alerts
        channel: "#alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
