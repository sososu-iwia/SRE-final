groups:
  # ── SLO Alerts ────────────────────────────────────────────────────────────
  - name: slo_alerts
    rules:
      # Fast burn: error rate too high over 1h — page immediately
      - alert: AvailabilitySLOBurnRateFast
        expr: |
          job:error_budget_burn_rate:1h > (14.4 * 0.005)
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Fast error-budget burn — SLO at risk"
          description: >
            Error rate is {{ $value | humanizePercentage }} over the last hour.
            At this rate the 30-day error budget will be exhausted in < 2 hours.
            Current success rate: {{ printf "%.3f" (1 - $value) }}.

      # Slow burn: elevated error rate over 6h — ticket
      - alert: AvailabilitySLOBurnRateSlow
        expr: |
          job:error_budget_burn_rate:6h > (6 * 0.005)
        for: 15m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "Slow error-budget burn — investigate before SLO breach"
          description: >
            Error rate is {{ $value | humanizePercentage }} over the last 6 hours.

      # High p95 latency breaching 500 ms SLO
      - alert: LatencySLOBreached
        expr: job:http_request_duration_p95:5m > 0.5
        for: 5m
        labels:
          severity: critical
          slo: latency
        annotations:
          summary: "p95 latency above 500 ms SLO"
          description: >
            p95 latency is {{ $value | humanizeDuration }}.
            SLO target is 500 ms.

      # Elevated p95 latency — approaching threshold
      - alert: LatencyApproachingSLO
        expr: job:http_request_duration_p95:5m > 0.35
        for: 10m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "p95 latency elevated — approaching SLO threshold"
          description: >
            p95 latency is {{ $value | humanizeDuration }} (threshold: 500 ms).

  # ── Infrastructure Alerts ─────────────────────────────────────────────────
  - name: infrastructure_alerts
    rules:
      - alert: PodCrashLooping
        expr: |
          rate(kube_pod_container_status_restarts_total{namespace="quiz-app"}[15m]) * 60 * 15 > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping"
          description: >
            Pod {{ $labels.pod }} restarted {{ $value | humanize }} times
            in the last 15 minutes.

      - alert: DeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas{namespace="quiz-app"}
          != kube_deployment_status_available_replicas{namespace="quiz-app"}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} has unavailable replicas"
          description: >
            Expected {{ $labels.spec_replicas }} replicas, only
            {{ $labels.available_replicas }} are available.

      - alert: NodeHighCPU
        expr: |
          100 - (avg by(node) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} CPU > 85%"
          description: "CPU utilization is {{ $value | humanize }}%."

      - alert: NodeHighMemory
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.instance }} memory > 85%"
          description: "Memory usage is {{ $value | humanize }}%."

      - alert: DatabaseConnectionPoolExhausted
        expr: |
          pg_stat_database_numbackends{datname="dbms2"} / pg_settings_max_connections > 0.80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connection pool > 80% used"
          description: >
            {{ $value | humanizePercentage }} of max_connections are in use.
            Risk of connection exhaustion.

      - alert: DatabaseHighQueryTime
        expr: |
          rate(pg_stat_database_blk_read_time{datname="dbms2"}[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL high block read time"
          description: "Block read time is elevated — check slow queries."

      - alert: HPAMaxedOut
        expr: |
          kube_horizontalpodautoscaler_status_current_replicas{namespace="quiz-app"}
          == kube_horizontalpodautoscaler_spec_max_replicas{namespace="quiz-app"}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HPA for {{ $labels.horizontalpodautoscaler }} at max replicas"
          description: >
            Auto-scaler is at its ceiling. Consider increasing max replicas
            or the underlying node group capacity.
