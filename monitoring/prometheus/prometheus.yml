global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: quiz-app

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: quiz-app
    metrics_path: /metrics
    static_configs:
      - targets: [quiz-app:1112]

  - job_name: postgres-exporter
    static_configs:
      - targets: [postgres-exporter:9187]
