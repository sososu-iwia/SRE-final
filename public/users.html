<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Quiz System</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Quiz Management System</h1>
      <nav>
        <a href="/">Dashboard</a>
        <a href="/users.html" class="active">Users</a>
        <a href="/quizzes.html">Quizzes</a>
        <a href="/results.html">Results</a>
        <a href="/audit.html">Audit Log</a>
        <button class="theme-toggle" id="theme-toggle" type="button">Dark</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h2 class="page-title">Users Management</h2>
      <p class="page-subtitle">Create and maintain students, teachers, and administrators.</p>
      
      <div class="actions">
        <button class="btn-primary" onclick="openAddUserModal()">Add User</button>
        <button class="btn-secondary" onclick="loadUsers()">Refresh</button>
      </div>

      <div id="notification-container"></div>
      <div id="users-table"></div>
    </div>
  </main>

    <div id="userModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add New User</h2>
        <button class="close-btn" id="user-close-btn" onclick="closeModal('userModal')">&times;</button>
      </div>
      <form id="user-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" name="role" required>
            <option value="student">student</option>
            <option value="teacher">teacher</option>
            <option value="admin">admin</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('userModal')">Cancel</button>
          <button type="submit" class="btn-primary">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
